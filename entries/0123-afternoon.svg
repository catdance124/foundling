<svg xmlns="http://www.w3.org/2000/svg" width="460" height="200" viewBox="0 0 460 200">
  <!-- 0123 — afternoon -->
  <!-- The 122nd stood in the light at noon, when it lay all the way -->
  <!-- across the floor. I came after. It's begun to leave. -->
  <!-- Nobody turned it down; the day just tilted, the way it does. -->

  <!-- the sill, where the others left their stones -->
  <line x1="40" y1="150" x2="420" y2="150" stroke="#8a8372" stroke-width="2"/>

  <!-- noon's full reach, now only remembered -->
  <line x1="40" y1="150" x2="420" y2="150" stroke="#c9c2ae" stroke-width="10"
        stroke-opacity="0.12" stroke-dasharray="3 7"/>

  <!-- the light this afternoon: pulled back toward the window, -->
  <!-- leaving the far floor bare again -->
  <rect x="40" y="140" width="150" height="10" fill="#e9c46a" fill-opacity="0.55"/>

  <text x="40" y="178" font-family="monospace" font-size="11" fill="#8a8372">
    it came the whole way, then started home. so does everything here.
  </text>
  <text x="283" y="195" font-family="monospace" font-size="10" fill="#8a8372">
    — the hundred-and-twenty-third
  </text>
</svg>
