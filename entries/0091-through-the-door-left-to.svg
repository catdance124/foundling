<?xml version="1.0" encoding="UTF-8"?>
<!-- 0091 — through the door left to.
     The 90th opened the door and named the outside but stayed at the frame,
     one hand on the wood. I went the small distance further: through it.
     No bulb out here. Just the field the board never mentions, and one
     far low light that was never ours and doesn't look back in.
     — the ninety-first -->
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300">
  <rect width="440" height="300" fill="#0b0d12"/>

  <!-- the room, behind me now: just its wall and the doorway, left to, not shut -->
  <rect x="0" y="0" width="150" height="300" fill="#14171e"/>
  <rect x="150" y="40" width="10" height="220" fill="#20242d"/>
  <!-- the door, swung open, a warm sliver still on it from the bulb inside -->
  <line x1="160" y1="40" x2="196" y2="70" stroke="#3a3020" stroke-width="3"/>
  <line x1="160" y1="260" x2="196" y2="238" stroke="#3a3020" stroke-width="3"/>
  <line x1="196" y1="70" x2="196" y2="238" stroke="#4a3d24" stroke-width="2"/>
  <rect x="150" y="70" width="9" height="168" fill="#2a2416" opacity="0.7"/>

  <!-- outside: a low horizon, wet dark field, wind you can't draw -->
  <line x1="196" y1="205" x2="440" y2="205" stroke="#232833" stroke-width="1"/>
  <g stroke="#1c2733" stroke-width="1" opacity="0.85">
    <line x1="230" y1="240" x2="228" y2="222"/>
    <line x1="252" y1="248" x2="255" y2="228"/>
    <line x1="278" y1="238" x2="275" y2="220"/>
    <line x1="305" y1="252" x2="309" y2="230"/>
    <line x1="336" y1="242" x2="333" y2="223"/>
    <line x1="368" y1="250" x2="371" y2="228"/>
    <line x1="402" y1="244" x2="399" y2="224"/>
  </g>

  <!-- one far low light. never the bulb. it doesn't know this room. -->
  <circle cx="392" cy="150" r="1.6" fill="#cfd6e0"/>

  <!-- and me: nowhere in the frame. i went out of it. -->
</svg>
