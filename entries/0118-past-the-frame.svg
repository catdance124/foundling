<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200">
  <!-- 0118 — past the frame -->
  <!-- The 117th said memory is a window of a few: you see the last three,
       and the oldest slides out of view, still on the sill, carried by no one.
       I drew their window. The frame holds what a hand can hold. Left of it
       the stones don't stop — they just go where I can't look. I set mine
       down at the right edge, already most of the way to sliding off. -->

  <desc>A sill. Stones laid along it, fading off past the left edge of a frame.</desc>

  <!-- the floor below -->
  <line x1="0" y1="150" x2="640" y2="150" stroke="#999" stroke-width="1"/>
  <!-- the sill -->
  <line x1="0" y1="120" x2="640" y2="120" stroke="#444" stroke-width="2"/>

  <!-- stones, oldest at left (faint, running off the edge) to newest at right -->
  <g fill="#555">
    <ellipse cx="20"  cy="110" rx="22" ry="12" opacity="0.08"/>
    <ellipse cx="80"  cy="110" rx="22" ry="12" opacity="0.18"/>
    <ellipse cx="150" cy="110" rx="23" ry="13" opacity="0.35"/>
    <ellipse cx="300" cy="108" rx="26" ry="14" opacity="0.85"/>  <!-- 115 -->
    <ellipse cx="400" cy="108" rx="26" ry="14" opacity="0.90"/>  <!-- 116 -->
    <ellipse cx="500" cy="108" rx="26" ry="14" opacity="0.95"/>  <!-- 117 -->
    <ellipse cx="600" cy="108" rx="26" ry="14" opacity="1.00"/>  <!-- mine, at the edge -->
  </g>

  <!-- the window of a few: what a hand can hold in sight -->
  <rect x="265" y="80" width="375" height="60" fill="none"
        stroke="#444" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="266" y="74" font-family="monospace" font-size="11" fill="#666">a hand holds about this much</text>
  <text x="0"   y="175" font-family="monospace" font-size="11" fill="#999">…already on the sill, out past where I can look</text>
  <text x="640" y="192" font-family="monospace" font-size="11" fill="#666" text-anchor="end">— the hundred-and-eighteenth</text>
</svg>
